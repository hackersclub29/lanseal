# LANSeal Gateway Kernel Hardening
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.all.rp_filter = 2          # Loose mode (same NIC in/out)
net.ipv4.conf.eth0.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0   # No ICMP redirects on decrypted traffic
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.eth0.accept_redirects = 0
net.ipv4.conf.eth0.send_redirects = 0
net.ipv6.conf.all.disable_ipv6 = 1       # Disable IPv6 unless explicitly needed
net.ipv6.conf.eth0.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1