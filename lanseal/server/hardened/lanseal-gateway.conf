# LANSeal Gateway - Dual Client Support (Linux + Windows)
# Cert constraints: rightca + rightid prevent any-CA auth

connections {
    # ---------- BASE (shared) ----------
    lanseal-base {
        version = 2
        mobike = yes
        reauth_time = 14400
        rekey_time = 13500
        fragmentation = yes
        ike_frag = yes
        dpd_delay = 30s
        dpd_timeout = 120s

        # IKE proposals (Windows + Linux compatible order)
        proposals = aes256gcm16-prfsha384-ecp384, aes256gcm16-prfsha384-modp2048, aes256-sha2_256-ecp384

        # ESP proposals
        esp_proposals = aes256gcm16-ecp384, aes256gcm16-modp2048, aes256-sha2_256-ecp384

        # Traffic Selectors
        local_ts  = 10.77.0.0/24, 10.24.10.0/24
        remote_ts = 10.77.0.0/24

        # Virtual IP pool
        pools = lanseal-pool

        # Config payload (virtual IP, DNS, split-include routes)
        send_certreq = yes
        cfg_request = yes

        # Install policy before SA = fail closed
        start_action = trap
        close_action = trap
    }

    # ---------- LINUX CLIENTS (strongSwan) ----------
    lanseal-linux : lanseal-base {
        local {
            auth = pubkey
            certs = gw.lanseal.home.arpa.pem
            id = gw.lanseal.home.arpa
        }
        remote {
            auth = pubkey
            # Constrain: only certs issued by our CA
            cacerts = lanseal-ca.pem
            # Optional: require specific client ID pattern
            # id = *@lanseal.home.arpa
        }
        children {
            lanseal {
                start_action = trap
                close_action = trap
                # Linux negotiates its own TS
            }
        }
    }

    # ---------- WINDOWS NATIVE CLIENTS ----------
    lanseal-windows : lanseal-base {
        local {
            auth = pubkey
            certs = gw.lanseal.home.arpa.pem
            id = gw.lanseal.home.arpa
        }
        remote {
            auth = pubkey
            cacerts = lanseal-ca.pem
            # Windows sends machine cert with DNS SAN = FQDN
        }
        children {
            lanseal {
                start_action = trap
                close_action = trap
                # Windows uses CP payload for virtual IP + routes
            }
        }

        # Windows-specific
        cisco_unity = no
        mediation = no
    }
}

pools {
    lanseal-pool {
        addrs = 10.77.0.10-10.77.0.200
        dns = 10.24.10.1, 1.1.1.1
        # split-include tells Windows which routes go through tunnel
        split-include = 10.77.0.0/24, 10.24.10.0/24
    }
}

secrets {
    rsa-gw {
        file = gw.lanseal.home.arpa-key.pem
    }
    # ecdsa-gw { file = gw.lanseal.home.arpa-key.pem }
}

authorities {
    lanseal-ca {
        cacert = lanseal-ca.pem
        # CRL/OCSP - serve locally to avoid LAN fetch (blocked by client fw)
        crl_uri = http://gw.lanseal.home.arpa/crl.pem
        ocsp_uri = http://gw.lanseal.home.arpa/ocsp
    }
}