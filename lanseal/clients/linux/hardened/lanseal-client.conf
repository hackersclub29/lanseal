# LANSeal Linux Client - Hardened

connections {
    lanseal {
        remote_addrs = gw.lanseal.home.arpa

        local {
            auth = pubkey
            certs = kali.lanseal.home.arpa.pem
            id = kali.lanseal.home.arpa
        }
        remote {
            auth = pubkey
            id = gw.lanseal.home.arpa
            # Constrain to our CA
            cacerts = lanseal-ca.pem
        }
        children {
            lanseal {
                local_ts  = 10.77.0.0/24
                remote_ts = 10.77.0.0/24, 10.24.10.0/24
                esp_proposals = aes256gcm16-prfsha384-ecp384
                start_action = trap
                close_action = trap
                mode = tunnel
            }
        }
        version = 2
        mobike = yes
        reauth_time = 14400
        rekey_time = 13500
        fragmentation = yes
        ike_frag = yes
        dpd_delay = 30s
        dpd_timeout = 120s

        # Proposals matching gateway
        proposals = aes256gcm16-prfsha384-ecp384, aes256gcm16-prfsha384-modp2048, aes256-sha2_256-ecp384
    }
}

secrets {
    rsa-kali {
        file = kali.lanseal.home.arpa-key.pem
    }
}